name: Release (manual)

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Create release for new version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for unreleased version
        id: check
        shell: bash
        run: node scripts/release-version-gate.mjs >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.released == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          NOTES="Released ${TAG}."
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}\n\n**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"

      - name: Trigger publish workflow
        if: steps.check.outputs.released == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml --ref "$RELEASE_TAG" -f ref="$RELEASE_TAG"
